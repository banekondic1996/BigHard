<script>
         const LAUNCHER_TYPE='nw'
         console.log("width="+window.innerWidth);
         /* let AppProcessID=nw.process.ppid; */ //App process ID, use window.process.ppid instead
         let barElement=document.getElementById('barAppsID');
         var colorMain="background-color: #353535ba;";
        const TASKBAR_THEME_STORAGE_KEY = 'elveTaskbarTheme';
        const APP_MENU_BOUNDS_STORAGE_KEY = 'elveAppMenuBounds';
        const DEFAULT_TASKBAR_THEME = {
            surfaceColor: '#050505',
            surfaceAlpha: 0.35,
            accentColor: '#b0b0b0'
        };
        const DEFAULT_APP_MENU_BOUNDS = {
            width: 600,
            height: 560
        };
        let taskbarTheme = loadTaskbarTheme();
        if(LAUNCHER_TYPE=='nw'){
         var win=nw.Window.get();
         initializeShellWindow();
        }
        console.log("checkpoint 8");
         var num=0;
        function normalizeHexColor(color, fallback) {
            if (typeof color !== 'string') {
                return fallback;
            }
            const trimmed = color.trim();
            if (/^#[0-9a-f]{6}$/i.test(trimmed)) {
                return trimmed.toLowerCase();
            }
            if (/^#[0-9a-f]{3}$/i.test(trimmed)) {
                return '#' + trimmed.slice(1).split('').map((part) => part + part).join('').toLowerCase();
            }
            return fallback;
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function hexToRgba(hex, alpha) {
            const normalized = normalizeHexColor(hex, '#000000');
            const safeAlpha = clamp(Number(alpha), 0, 1);
            const r = parseInt(normalized.slice(1, 3), 16);
            const g = parseInt(normalized.slice(3, 5), 16);
            const b = parseInt(normalized.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${safeAlpha})`;
        }

        function shadeHex(hex, amount) {
            const normalized = normalizeHexColor(hex, '#000000');
            const channel = (value) => clamp(Math.round(value + amount), 0, 255);
            const r = channel(parseInt(normalized.slice(1, 3), 16));
            const g = channel(parseInt(normalized.slice(3, 5), 16));
            const b = channel(parseInt(normalized.slice(5, 7), 16));
            return `#${[r, g, b].map((part) => part.toString(16).padStart(2, '0')).join('')}`;
        }

        function loadTaskbarTheme() {
            try {
                const stored = JSON.parse(localStorage.getItem(TASKBAR_THEME_STORAGE_KEY) || '{}');
                return {
                    surfaceColor: normalizeHexColor(stored.surfaceColor, DEFAULT_TASKBAR_THEME.surfaceColor),
                    surfaceAlpha: clamp(Number.isFinite(stored.surfaceAlpha) ? stored.surfaceAlpha : DEFAULT_TASKBAR_THEME.surfaceAlpha, 0, 0.99),
                    accentColor: normalizeHexColor(stored.accentColor, DEFAULT_TASKBAR_THEME.accentColor)
                };
            } catch (error) {
                return { ...DEFAULT_TASKBAR_THEME };
            }
        }

        function applyTaskbarTheme(patch = {}, options = {}) {
            const { persist = true, broadcast = true } = options;
            taskbarTheme = {
                ...taskbarTheme,
                ...patch
            };
            taskbarTheme.surfaceColor = normalizeHexColor(taskbarTheme.surfaceColor, DEFAULT_TASKBAR_THEME.surfaceColor);
            taskbarTheme.accentColor = normalizeHexColor(taskbarTheme.accentColor, DEFAULT_TASKBAR_THEME.accentColor);
            taskbarTheme.surfaceAlpha = clamp(Number(taskbarTheme.surfaceAlpha), 0, 0.99);

            document.documentElement.style.setProperty('--taskbar-surface', hexToRgba(taskbarTheme.surfaceColor, taskbarTheme.surfaceAlpha));
            document.documentElement.style.setProperty('--taskbar-surface-strong', hexToRgba(taskbarTheme.surfaceColor, clamp(taskbarTheme.surfaceAlpha + 0.22, 0, 0.99)));
            document.documentElement.style.setProperty('--taskbar-surface-alpha', String(taskbarTheme.surfaceAlpha));
            document.documentElement.style.setProperty('--accent-color', hexToRgba(taskbarTheme.accentColor, 0.72));
            document.documentElement.style.setProperty('--accent-color-solid', taskbarTheme.accentColor);

            const barColorInput = document.getElementById('barColorId');
            const accentColorInput = document.getElementById('buttonsColorId');
            const transparencyInput = document.getElementById('barTransparencyId');

            if (barColorInput) {
                barColorInput.value = taskbarTheme.surfaceColor;
            }
            if (accentColorInput) {
                accentColorInput.value = taskbarTheme.accentColor;
            }
            if (transparencyInput) {
                transparencyInput.value = taskbarTheme.surfaceAlpha.toFixed(2);
            }

            if (persist) {
                localStorage.setItem(TASKBAR_THEME_STORAGE_KEY, JSON.stringify(taskbarTheme));
            }

            if (broadcast) {
                broadcastTaskbarTheme();
            }
        }

        function loadAppMenuBounds() {
            try {
                const stored = JSON.parse(localStorage.getItem(APP_MENU_BOUNDS_STORAGE_KEY) || '{}');
                return {
                    width: clamp(parseInt(stored.width, 10) || DEFAULT_APP_MENU_BOUNDS.width, 420, Math.max(420, window.innerWidth - 20)),
                    height: clamp(parseInt(stored.height, 10) || DEFAULT_APP_MENU_BOUNDS.height, 420, Math.max(420, window.innerHeight - 120))
                };
            } catch (error) {
                return { ...DEFAULT_APP_MENU_BOUNDS };
            }
        }

        function saveAppMenuBounds(bounds) {
            localStorage.setItem(APP_MENU_BOUNDS_STORAGE_KEY, JSON.stringify({
                width: Math.round(bounds.width),
                height: Math.round(bounds.height)
            }));
        }

        function applyAppMenuBounds(bounds = loadAppMenuBounds()) {
            const appMenuView = document.getElementById('appMenuID');
            if (!appMenuView) return bounds;
            const nextBounds = {
                width: clamp(Math.round(bounds.width), 420, Math.max(420, window.innerWidth - 20)),
                height: clamp(Math.round(bounds.height), 420, Math.max(420, window.innerHeight - 120))
            };
            appMenuView.style.width = `${nextBounds.width}px`;
            appMenuView.style.height = `${nextBounds.height}px`;
            return nextBounds;
        }

        function watchAppMenuResize() {
            const appMenuView = document.getElementById('appMenuID');
            if (!appMenuView || typeof ResizeObserver !== 'function') return;
            let resizeSaveTimer = null;
            const observer = new ResizeObserver((entries) => {
                const entry = entries[0];
                if (!entry) return;
                const bounds = {
                    width: entry.contentRect.width,
                    height: entry.contentRect.height
                };
                clearTimeout(resizeSaveTimer);
                resizeSaveTimer = setTimeout(() => {
                    const applied = applyAppMenuBounds(bounds);
                    saveAppMenuBounds(applied);
                }, 120);
            });

        resizableBar.style.transform      = 'translateX(-50%)';

        resizableBar.style.flexDirection  = 'row';

    } else if (position === 'top') {

        resizableBar.style.left           = '50%';
        resizableBar.style.transform      = 'translateX(-50%)';

        resizableBar.style.transform      = 'translateY(-50%)';
        resizableBar.style.width          = thickness;
        resizableBar.style.height         = widthPct + '%';
        resizableBar.style.flexDirection  = 'column';
        resizableBar.style.alignItems     = 'center';

        handle.style.width  = resizableBar.offsetWidth  + 'px';

//////////////////////////////////////// Auto-hide taskbar
var autoHideEnabled = false;
var autoHideNormalHeight = null;
var autoHideNormalWidth = null;
var autoHideTimeout = null;

function toggleAutoHide(enabled) {
    autoHideEnabled = enabled;
    // Update toggle knob UI
    const knob = document.getElementById('autoHideKnob');
    const slider = document.getElementById('autoHideSliderUI');
    if (enabled) {
        knob.style.transform = 'translateX(22px)';
        slider.style.background = 'rgba(59,130,246,0.7)';
        // Attach hover listeners
        resizableBar.addEventListener('mouseenter', autoHideExpand);
        resizableBar.addEventListener('mouseleave', autoHideCollapse);
        // Collapse immediately
        autoHideCollapse();
    } else {
        knob.style.transform = 'translateX(0px)';
        slider.style.background = 'rgba(255,255,255,0.2)';
        resizableBar.removeEventListener('mouseenter', autoHideExpand);
        resizableBar.removeEventListener('mouseleave', autoHideCollapse);
        // Restore bar
        autoHideExpand();
    }
}

function autoHideCollapse() {
    clearTimeout(autoHideTimeout);
    autoHideTimeout = setTimeout(function() {
        if (!autoHideEnabled) return;
        // Save current size before collapsing (only once)
        if (autoHideNormalHeight === null && autoHideNormalWidth === null) {
            autoHideNormalHeight = resizableBar.style.height || resizableBar.offsetHeight + 'px';
            autoHideNormalWidth  = resizableBar.style.width  || resizableBar.offsetWidth  + 'px';
        }
        // Hide all children except the clock
        Array.from(resizableBar.children).forEach(function(child) {
            if (child.id !== 'barClockID') {
                child._autoHideDisplay = child.style.display || '';
                child.style.display = 'none';
            }
        });
        // Shrink bar to 16px
        if (barOrientation === 'horizontal') {
            resizableBar.style.height = '16px';
        } else {
            resizableBar.style.width = '16px';
        }
        // Center clock in the collapsed bar
        var clock = document.getElementById('barClockID');
        clock.style.margin = 'auto';
        clock.style.fontSize = '10px';
        clock.style.textAlign = 'center';
    }, 400);
}

function autoHideExpand() {
    clearTimeout(autoHideTimeout);
    // Restore size
    if (barOrientation === 'horizontal') {
        resizableBar.style.height = autoHideNormalHeight || '94px';
    } else {
        resizableBar.style.width = autoHideNormalWidth || '94px';
    }
    // Restore all children
    Array.from(resizableBar.children).forEach(function(child) {
        if (child.id !== 'barClockID') {
            child.style.display = child._autoHideDisplay !== undefined ? child._autoHideDisplay : '';
        }
    });
    // Reset clock styles
    var clock = document.getElementById('barClockID');
    clock.style.margin = '';
    clock.style.fontSize = '';
    clock.style.textAlign = '';
}

<!-- Load labwc client and integration -->
<script src="integrated-shell.js"></script>

<!-- Update button clicks to pass event -->
<script>
// Update the apps button to pass click event
const appsButton = document.querySelector('[onclick="openAppMenu(event)"]');
if (appsButton) {
    appsButton.onclick = function(e) {
        e.stopPropagation();
        openAppMenu(e);
    };
}

// Update calendar button
const clockButton = document.getElementById('barClockID');
if (clockButton) {
    clockButton.onclick = function(e) {
        e.stopPropagation();
        openCalendar(e);
    };
}

// Update control center button
const toggleButton = document.querySelector('[onclick*="openControlCenter"]');
if (toggleButton) {
    toggleButton.onclick = function(e) {
        e.stopPropagation();
        openControlCenter(e);
    };
}

window.addEventListener('load', () => {
    initializeShellWindow();
    applyAppMenuBounds();
    watchAppMenuResize();
    document.querySelectorAll('webview').forEach((view) => {
        view.addEventListener('loadstop', broadcastTaskbarTheme);
    });
    broadcastTaskbarTheme();
});

// Close menus when clicking outside
document.addEventListener('click', () => {
  closeElements();
});
win.on('blur', function () {
    closeElements();
  });
function closeElements()
{
    const appMenuElement = document.getElementById('appMenuID');
    const calendarElement = document.getElementById('calendarID');
    const controlElement = document.getElementById('controlCenterID');
    
    // Close app menu if clicking outside
    if (appMenuElement && !appMenuElement.classList.contains('hide')) {
        if (appMenuElement._popperInstance) {
            appMenuElement._popperInstance.destroy();
            appMenuElement._popperInstance = null;
        }
        appMenuElement.classList.add('hide');
    }
    
    // Close calendar if clicking outside
    if (calendarElement && !calendarElement.classList.contains('hide')) {
        if (calendarElement._popperInstance) {
            calendarElement._popperInstance.destroy();
            calendarElement._popperInstance = null;
        }
        calendarElement.classList.add('hide');
    }
    
    // Close control center if clicking outside
    if (controlElement && !controlElement.classList.contains('hide')) {
        if (controlElement._popperInstance) {
            controlElement._popperInstance.destroy();
            controlElement._popperInstance = null;
        }
        controlElement.classList.add('hide');
    }
}

console.log('[Shell] Menu positioning integration loaded');
</script>
