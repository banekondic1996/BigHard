<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elve Desktop Launcher</title>
</head>
<body>
<script>
    const launcher = nw.Window.get();
    let deskWindow = null;
    let topWindow = null;

    function openShellWindows() {
        const screenWidth = window.screen && window.screen.width ? window.screen.width : 1920;
        const screenHeight = window.screen && window.screen.height ? window.screen.height : 1080;

        const deskOptions = {
            title: 'Desk',
            frame: false,
            fullscreen: true,
            transparent: false,
            resizable: false,
            show: true,
            focus: false,
            always_on_top: false,
            show_in_taskbar: false,
            x: 0,
            y: 0,
            width: screenWidth,
            height: screenHeight
        };

        const topOptions = {
            title: 'Top',
            frame: false,
            fullscreen: false,
            transparent: true,
            resizable: false,
            show: false,
            focus: false,
            always_on_top: true,
            show_in_taskbar: false,
            x: 0,
            y: 0,
            width: screenWidth,
            height: screenHeight
        };

        setTimeout(()=>{nw.Window.open('/desk2.html', deskOptions, (newWindow) => {
            deskWindow = newWindow;
            deskWindow.moveTo(0, 0);
            deskWindow.resizeTo(screenWidth, screenHeight);
            deskWindow.setAlwaysOnTop(false);
            deskWindow.show();
        });},2000)

        // setTimeout(()=>{nw.Window.open('/top.html', topOptions, (newWindow) => {
        //     topWindow = newWindow;
        //     topWindow.on('loaded', () => {
        //         topWindow.moveTo(0, 0);
        //         topWindow.resizeTo(screenWidth, screenHeight);
        //         topWindow.setAlwaysOnTop(true);
        //         topWindow.show();
        //     });
        // });},5000)
    }

    openShellWindows();

    launcher.hide();
    if (typeof launcher.setShowInTaskbar === 'function') {
        launcher.setShowInTaskbar(false);
    }

    launcher.on('close', () => {
        if (topWindow && !topWindow.closed) topWindow.close(true);
        if (deskWindow && !deskWindow.closed) deskWindow.close(true);
        launcher.close(true);
    });
</script>
</body>
</html>
